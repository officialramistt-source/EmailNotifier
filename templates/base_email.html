<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #0f172a;
      padding: 24px 12px;
      box-sizing: border-box;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .header .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #dbeafe;
    }
    .content {
      padding: 20px 18px;
    }
    .card {
      background-color: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .task-item {
      padding: 10px 12px;
      background-color: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid #3b82f6;
      font-size: 14px;
      line-height: 1.4;
    }
    .task-item.critical {
      border-left-color: #ef4444;
    }
    .task-item.important {
      border-left-color: #f59e0b;
    }
    .task-item.done {
      border-left-color: #10b981;
      text-decoration: line-through;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
    }
    .badge-critical { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .badge-important { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-done { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-habit { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    
    .quote-box {
      background-color: #1e293b;
      border-left: 3px solid #60a5fa;
      padding: 12px;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #cbd5e1;
      font-size: 13px;
      margin-top: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff !important;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 14px;
      box-sizing: border-box;
    }
    .footer {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #334155;
    }
    .deadline-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }
    .deadline-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>{{ header_title }}</h1>
        <div class="subtitle">{{ header_subtitle }}</div>
      </div>
      <div class="content">
        {{ body_content }}
      </div>
      <div class="footer">
        ⚡ <strong>projectAnti</strong> • Автономная система 24/7 • {{ current_time }}
      </div>
    </div>
  </div>
</body>
</html>
